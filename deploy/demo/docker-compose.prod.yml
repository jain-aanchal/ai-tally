# ai-tally demo-deploy-kit - single-VM production overlay (CTO-243).
#
# Layered ON TOP of the base stack, never instead of it:
#
#   docker compose -f infra/docker-compose.yml -f deploy/demo/docker-compose.prod.yml up -d --build
#
# What this overlay does:
#   - Adds a `web` service (the Next.js dashboard) built from deploy/demo/web.Dockerfile.
#   - Adds a `caddy` service that terminates TLS and enforces HTTP basic-auth. Caddy is the ONLY
#     service that publishes host ports (80/443).
#   - Removes the host port publishing from clickhouse / postgres / redpanda / minio / gateway so
#     that on a public VM nothing is reachable except through Caddy. They keep talking to each other
#     over the compose network by service name, exactly as before.
#
# `ports: !reset []` uses Compose's override reset so the base file's port list is dropped rather
# than merged (a plain `ports: []` is ignored by the merge). Requires Docker Compose v2.24.4+; if
# your Compose is older, replace `!reset []` with `expose:`-only by hand.
#
# The demo data this stack serves is SYNTHETIC (see deploy.sh / reseed.sh). No real tenant traffic.

services:
  # --- Base services: keep them internal-only (no host ports on a public VM) -------------------
  clickhouse:
    ports: !reset []
  postgres:
    ports: !reset []
  redpanda:
    ports: !reset []
  minio:
    ports: !reset []
  gateway:
    # The gateway carries WRITE endpoints (/v1/batches ingest, control-plane /v1/tenant/*). It must
    # stay behind Caddy/basic-auth on a public VM; the web service reaches it as http://gateway:8080
    # over the internal network. To let testers push their OWN telemetry, expose /v1/batches via the
    # commented block in the Caddyfile instead of publishing a host port here.
    ports: !reset []

  # --- Dashboard (server-side reads ClickHouse, calls the gateway) -----------------------------
  web:
    build:
      # Relative paths in a compose overlay resolve against the FIRST -f file's directory (infra/),
      # not this file's location. So `..` is the repo root and the Dockerfile path is repo-relative.
      # Always invoke as: docker compose -f infra/docker-compose.yml -f deploy/demo/docker-compose.prod.yml
      context: ..
      dockerfile: deploy/demo/web.Dockerfile
      args:
        # Inlined by `next build`, so it must be a build arg. See the Dockerfile.
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
    container_name: ai-tally-web
    environment:
      # EXACT env var names the web reads (web/lib/clickhouse.ts, web/lib/tenant.ts, etc.).
      TALLY_CLICKHOUSE_URL: http://clickhouse:8123
      TALLY_CLICKHOUSE_USER: ${CLICKHOUSE_USER:-tally}
      TALLY_CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-tally}
      TALLY_CLICKHOUSE_DB: default
      TALLY_GATEWAY_URL: http://gateway:8080
      # CTO-371: where the server-rendered pages fetch their OWN route handlers. Without this,
      # web/lib/api.ts derives the base from the incoming request's Host header, so the container
      # tries to reach https://${DOMAIN} from inside itself: out to the public IP, back through
      # Caddy. A droplet generally cannot hairpin to its own public address, so every page dies on
      # UND_ERR_CONNECT_TIMEOUT after 10s. Loopback keeps the call inside the container, where the
      # Next server is already listening, and skips TLS and the proxy for a request that never
      # needed either.
      #
      # Despite the NEXT_PUBLIC_ prefix this is read only by api.ts on the server (grep confirms no
      # client reference), so pointing it at loopback cannot leak into a browser bundle.
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:3000
      # Initiative 1 §10: the dev escape hatch that pins the tenant, so the demo VM needs no Clerk
      # account. It MUST be the tenant UUID, not the name `local-dev`: the web binds this value
      # straight into the ClickHouse read filter (TenantId = ...) and the backfill tags spans with
      # the UUID, so a name matches no rows and renders an empty dashboard.
      #
      # Not settable by hand in .env: the UUID only exists once `make seed` has run. deploy.sh
      # resolves it from Postgres after seeding and exports it, then recreates this service. Left
      # empty on the very first `up` (before seeding), where the dashboard errors loudly rather
      # than rendering a blank page for an unknown tenant.
      TALLY_DEV_TENANT: ${TALLY_DEV_TENANT:-}
      # CTO-367: Clerk, for AUTH_MODE=clerk. All four are empty in the basic-auth demo mode, where
      # TALLY_DEV_TENANT pins the tenant and Clerk is never consulted. In clerk mode TALLY_DEV_TENANT
      # is empty instead and these carry the sign-in: the two modes are mutually exclusive by
      # construction, which is the same property web/lib/mock.ts relies on to keep fixtures away from
      # a real tenant.
      #
      # NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY is inlined into the client bundle at BUILD time, so it is
      # also a build arg below. Changing it needs a rebuild, not a restart.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      CLERK_WEBHOOK_SIGNING_SECRET: ${CLERK_WEBHOOK_SIGNING_SECRET:-}

      # CTO-268: the explicit "yes, serve this with no authentication" opt-in. TALLY_DEV_TENANT does
      # not only pin the tenant, it turns the dashboard's auth off completely, and this kit is the
      # thing operators copy when standing up a REAL instance. So the web image refuses to boot on
      # TALLY_DEV_TENANT alone in a production build; disabling auth for real takes this second
      # variable too. The demo sets it deliberately (deploy.sh / reseed.sh, via pin_dashboard_tenant)
      # because the data here is synthetic and Caddy basic auth is the access control. Do NOT carry
      # this line into a deployment that serves real tenant data.
      TALLY_ALLOW_INSECURE_NO_AUTH: ${TALLY_ALLOW_INSECURE_NO_AUTH:-}
      # Initiative 1 §6: the control-plane service token, the same secret the gateway reads as
      # TALLY_GATEWAY_SERVICE_TOKEN (the gateway picks it up from the base compose file and the
      # same .env, so the two cannot disagree). The gateway's gate is a no-op while the demo VM
      # runs with TALLY_REQUIRE_API_KEY off; turn auth on and it is mandatory on both sides.
      GATEWAY_SERVICE_TOKEN: ${TALLY_GATEWAY_SERVICE_TOKEN:-}
    # No host port: the browser reaches the dashboard only through Caddy (caddy -> web:3000).
    depends_on:
      clickhouse:
        condition: service_healthy
      gateway:
        condition: service_healthy
    restart: unless-stopped

  # --- Hosted edge proxy: zero-code connect on ${INGEST_DOMAIN} ---------------------------------
  # A customer points OPENAI_BASE_URL (or the Anthropic / Gemini equivalent) at
  # https://${INGEST_DOMAIN}/<provider> and adds an X-Tenant-Key header. The proxy forwards the call
  # to the real provider byte for byte and ships a metadata-only span to the gateway over the
  # internal network, so the gateway's /v1/batches stays unpublished.
  #
  # PROFILE `ingest`, enabled by deploy.sh in AUTH_MODE=clerk. The proxy refuses to start without a
  # service token for the key feed, so running it unconditionally would leave the basic-auth demo,
  # which has no token, with a container restarting forever.
  #
  # NO healthcheck, deliberately. The image is FROM scratch: no shell and no HTTP client, so any
  # compose healthcheck fails every attempt (the trap #339 documents for the ECS task definition).
  # Liveness is /healthz, reachable through Caddy.
  #
  # NOT redundant. This is one container on one VM sitting in the synchronous path of a customer's
  # LLM calls, so when this box is down their AI features are down, not just our dashboard. Fine for
  # pilots who have been told; a broad launch wants two instances behind a load balancer, which is
  # what deploy/aws/terraform builds.
  edge-proxy:
    profiles: ["ingest"]
    build:
      context: edge-proxy   # relative to infra/, the first -f file
    container_name: ai-tally-edge-proxy
    environment:
      EDGE_PROXY_LISTEN: ":8088"
      # Path mode on one hostname rather than host mode on three: one DNS record and one certificate.
      # The prefix is stripped before forwarding, so the provider sees its own path.
      EDGE_PROXY_ROUTE_MODE: path
      EDGE_PROXY_ROUTES: "/openai=https://api.openai.com:openai,/anthropic=https://api.anthropic.com:anthropic,/gemini=https://generativelanguage.googleapis.com:gemini"
      # A request must present a live ai-tally key. Without this the hostname is an open relay to
      # every provider for anyone who finds it.
      EDGE_PROXY_REQUIRE_TENANT: "true"
      # Key-to-tenant resolution from the gateway's delta feed, cached in memory, so no gateway call
      # sits in the request path. A newly created key can miss the cache for one refresh (45s).
      EDGE_PROXY_KEYS_URL: http://gateway:8080/v1/edge/keys
      EDGE_PROXY_SERVICE_TOKEN: ${TALLY_GATEWAY_SERVICE_TOKEN:-}
      EDGE_PROXY_TELEMETRY_URL: http://gateway:8080/v1/batches
    # No host port: the only way in is Caddy on ${INGEST_DOMAIN}.
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped

  # --- Reverse proxy: automatic TLS + HTTP basic-auth, the only public surface -----------------
  caddy:
    image: caddy:2
    container_name: ai-tally-caddy
    depends_on:
      - web
    ports:
      - "80:80"    # ACME HTTP-01 challenge + redirect to HTTPS
      - "443:443"  # the private demo link
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      # Only Caddyfile.clerk reads it, and deploy.sh requires it in that mode.
      INGEST_DOMAIN: ${INGEST_DOMAIN:-}
      # CTO-367: only the basic-auth site file reads these, so they are optional. AUTH_MODE=clerk
      # mounts Caddyfile.clerk, which has no basic_auth block; leaving them unset there is correct
      # rather than an omission. Caddy fails to start on an unset variable a site file DOES use, so
      # a mismatch between AUTH_MODE and .env surfaces immediately instead of serving unprotected.
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH:-}
    volumes:
      # CTO-367: which site file depends on AUTH_MODE. `basic` (the default, unchanged) fronts the
      # synthetic demo with HTTP basic-auth because the app itself runs with auth off. `clerk` mounts
      # a file with no basic_auth block, because Clerk's redirects and its organization.created
      # webhook cannot pass a basic-auth challenge. deploy.sh exports CADDY_SITE_FILE.
      - ../deploy/demo/${CADDY_SITE_FILE:-Caddyfile}:/etc/caddy/Caddyfile:ro   # relative to infra/ (first -f file)
      - caddy_data:/data    # ACME account + issued certs; persist so restarts do not re-issue
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
