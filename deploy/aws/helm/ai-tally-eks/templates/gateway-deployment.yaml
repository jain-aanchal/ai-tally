{{- if .Values.gateway.enabled }}
{{- /* Initiative 1 §6: fail at TEMPLATE time, not as a CrashLoop, when the control-plane gate is
     switched on without a service token. The gateway refuses to boot in that state (fail closed),
     and this turns a mystery restart loop into an actionable `helm upgrade` error. Sequencing:
     create the secret FIRST, then set secretsManager.secrets.gatewayServiceToken. */ -}}
{{- if and .Values.gateway.config.requireApiKey (not .Values.secretsManager.secrets.gatewayServiceToken) }}
{{- fail "gateway.config.requireApiKey is true but secretsManager.secrets.gatewayServiceToken is empty: create the control-plane service-token secret in your secret manager, then set that value to its name (see the deploy README)." }}
{{- end }}
{{- $tier := "gateway" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-tally.tierName" (dict "ctx" . "tier" $tier) }}
  labels:
    {{- include "ai-tally.labels" . | nindent 4 }}
    {{- include "ai-tally.selectorLabels" (dict "ctx" . "tier" $tier) | nindent 4 }}
spec:
  {{- if not .Values.gateway.autoscaling.enabled }}
  replicas: {{ .Values.gateway.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "ai-tally.selectorLabels" (dict "ctx" . "tier" $tier) | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll pods when non-secret config changes so a ConfigMap edit takes effect.
        checksum/config: {{ include (print $.Template.BasePath "/gateway-configmap.yaml") . | sha256sum }}
        {{- with .Values.gateway.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "ai-tally.selectorLabels" (dict "ctx" . "tier" $tier) | nindent 8 }}
    spec:
      serviceAccountName: {{ include "ai-tally.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: gateway
          image: "{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.gateway.service.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "ai-tally.tierName" (dict "ctx" . "tier" $tier) }}
            # DB password + provider keys, synced from Secrets Manager (or an existingSecret).
            - secretRef:
                name: {{ include "ai-tally.secretName" . }}
          {{- if eq .Values.secretsManager.mode "csi" }}
          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
          {{- end }}
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
      # NOTE: unlike the GKE chart there is NO database auth-proxy sidecar — on AWS the gateway
      # reaches RDS directly over the VPC. Put the nodes and RDS in the same VPC and allow the node
      # security group to reach RDS:5432. The DSN (endpoint + password) is the postgresDsn secret.
      {{- if eq .Values.secretsManager.mode "csi" }}
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ include "ai-tally.spcName" . }}
      {{- end }}
      {{- with .Values.gateway.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gateway.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gateway.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
