# ai-tally dashboard (Next.js) on Cloud Run (fully managed).
#
# Placeholders to replace before `gcloud run services replace` (see deploy/gcp/README.md):
#   PROJECT   GCP project id
#   REGION    e.g. us-central1
#   TAG       image tag
#   REPLACE_GATEWAY_URL      the gateway Cloud Run URL (https://ai-tally-gateway-....run.app)
#   REPLACE_CLICKHOUSE_URL   ClickHouse HTTP endpoint (https://...clickhouse.cloud:8443 or in-VPC)
#
# The dashboard queries ClickHouse directly and calls the gateway. Its only secret is the ClickHouse
# password (pulled from Secret Manager). The runtime SA needs roles/secretmanager.secretAccessor.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: ai-tally-web
  labels:
    app.kubernetes.io/part-of: ai-tally
    app.kubernetes.io/component: web
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "6"
    spec:
      serviceAccountName: ai-tally-run@PROJECT.iam.gserviceaccount.com
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: REGION-docker.pkg.dev/PROJECT/ai-tally/web:TAG
          ports:
            # Cloud Run sets PORT=8080; Next's standalone server honours PORT.
            - containerPort: 8080
          env:
            - { name: TALLY_GATEWAY_URL,    value: "REPLACE_GATEWAY_URL" }
            # Initiative 1 §10: the dev escape hatch that pins a tenant and skips Clerk. Leave it
            # EMPTY on the product path, where the tenant comes from the caller's Clerk org. Set it
            # only for a single-tenant demo, and then to the tenant UUID (`make seed` prints it),
            # never to a name: the value is bound into the ClickHouse read filter (TenantId = ...),
            # so a name matches no rows and renders an empty dashboard.
            - { name: TALLY_DEV_TENANT,     value: "" }
            # CTO-268: setting TALLY_DEV_TENANT does not only pin a tenant, it disables the
            # dashboard's authentication completely. The container REFUSES TO BOOT when it is set in
            # a production build unless this second variable explicitly says that is intended. Leave
            # it empty. "1" only for a public demo of synthetic data behind your own access control.
            - { name: TALLY_ALLOW_INSECURE_NO_AUTH, value: "" }
            - { name: TALLY_CLICKHOUSE_URL, value: "REPLACE_CLICKHOUSE_URL" }
            - { name: TALLY_CLICKHOUSE_DB,  value: "default" }
            - { name: TALLY_CLICKHOUSE_USER, value: "tally" }
            - { name: NEXT_PUBLIC_TALLY_DASHBOARD_REFRESH_MS, value: "5000" }
            - name: TALLY_CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef: { name: ai-tally-clickhouse-password, key: latest }
            # Initiative 1 §6: same secret the gateway reads as TALLY_GATEWAY_SERVICE_TOKEN. The web
            # server is the only legitimate caller of the gateway control plane.
            - name: GATEWAY_SERVICE_TOKEN
              valueFrom:
                secretKeyRef: { name: ai-tally-gateway-service-token, key: latest }
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
