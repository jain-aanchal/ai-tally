[project]
name = "tally-sdk"
version = "0.0.1"
description = "ai-tally Python SDK — cost-and-value observability for AI products (OTel gen_ai.* native)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
# CTO-261: the onboarding-agent recipe catalog is YAML; jsonschema backs the
# schema-validation guard in tests/test_recipes.py. Kept dev-only so the SDK
# runtime stays dependency-free (see `dependencies = []` above).
dev = [
    "pytest>=8.0",
    "ruff>=0.12,<0.16",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tally"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." makes the onboarding_mcp component (CTO-261) importable alongside the SDK's src tree.
pythonpath = ["src", "."]
addopts = "-q"
