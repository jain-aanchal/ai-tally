[project]
name = "tally-sdk"
version = "0.0.1"
description = "ai-tally Python SDK: cost-and-value observability for AI products (OTel gen_ai.* native)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
# CTO-261: the onboarding-agent recipe catalog is YAML; jsonschema backs the
# schema-validation guard in tests/test_recipes.py. Kept dev-only so the SDK
# runtime stays dependency-free (see `dependencies = []` above).
dev = [
    "pytest>=8.0",
    "ruff>=0.12,<0.16",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
]
# CTO-261 section 4.2: the onboarding MCP server. Optional so the SDK runtime stays
# dependency-free; a developer connecting their coding agent installs this extra.
# pyyaml is a real runtime need here (the recipe catalog is YAML), which is why it is
# listed again rather than borrowed from dev.
mcp = [
    # >=1.2, not >=1.0: FastMCP was only merged into the official mcp SDK in 1.2.0, so a
    # resolver landing on 1.0.x / 1.1.x gives a wheel with no fastmcp module and the server
    # dies with "the 'mcp' package is required" while mcp IS installed, which is exactly the
    # misleading error this work removes (CTO-261 review finding 3).
    "mcp>=1.2",
    "pyyaml>=6.0",
]

[project.scripts]
# The stdio entrypoint a coding agent's MCP config launches (see README "Connect your
# coding agent"). Fails with a clear RuntimeError when the mcp extra is absent.
tally-onboarding-mcp = "onboarding_mcp.server:main"
# CTO-261 P2: the hosted repo PR bot. Stdlib only (urllib + git), so it needs no extra;
# the scoped GitHub token is supplied by reference in the environment, never as a flag.
tally-onboarding-bot = "onboarding_bot.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# onboarding_mcp ships in the wheel so the console entrypoint above resolves for an
# installed SDK; recipes/ is the data the server reads and is forced in below.
# A wheel's contents cannot vary by extra, so onboarding_mcp is present in the base wheel
# but is NOT usable from it: the recipe catalog is YAML and pyyaml lives in the mcp extra,
# which the SDK runtime deliberately does not carry (dependencies = [] above). Importing it
# without the extra raises a clear, actionable error from catalog.py rather than a bare
# "No module named 'yaml'", and server.py's message says the same thing (CTO-261 review
# finding 4). Do not "fix" this by moving pyyaml into dependencies.
packages = ["src/tally", "onboarding_mcp", "onboarding_bot"]
force-include = { "recipes" = "onboarding_mcp/recipes" }

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." makes the onboarding_mcp component (CTO-261) importable alongside the SDK's src tree.
pythonpath = ["src", "."]
addopts = "-q"
