name: CI

on:
  push:
    branches: [main]
    # Release tags publish a semver-tagged image (CTO-334). The four test jobs run on a tag push too,
    # so nothing is ever published from a commit whose suites were not green.
    tags: ["v*"]
  pull_request:
  # Lets an operator rebuild and republish the images for a ref without an empty commit, which
  # matters the first time the ECR role exists and the last green merge predates it.
  workflow_dispatch:

jobs:
  python-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync (dev)
        run: uv sync --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest

  # CTO-394: this job provisions Postgres, and that is the whole point of the service block below.
  #
  # `tests/test_batch_idempotency_pg.py` (8 tests) and `tests/test_adopt_org_pg.py` (10 tests) are
  # gated on `TALLY_TEST_POSTGRES_DSN`, which nothing ever set here, so all 18 skipped on every pull
  # request and every release. What they cover is not incidental: the claim/lease SQL that stops two
  # workers writing one batch's spans twice (the concurrency property a fake cannot prove), and the
  # DELETE-plus-UPDATE cascade that org adoption runs in one transaction.
  #
  # Five more tests gate on a reachable database rather than on the variable: the four `test_live_*`
  # in `tests/test_scheduler_locking.py` and one in `tests/test_scheduler_pooling.py`, which fall
  # back to `localhost:5432` and skip when nothing answers. The service container answers, so this
  # job runs them too, and that is deliberate rather than incidental: they are the advisory-lock
  # assertions (two runners take one lock, a killed session releases its lock) and the pooled
  # connection count, none of which a fake can make. They were measured before being switched on:
  # 40 consecutive local runs against a `postgres:16` container, 15 of them under 8x CPU
  # contention, with no failure. CTO-397 already tracks one flaky CI gate and a second would be
  # expensive, so if any of these five does prove flaky under real runner load, gate them behind an
  # opt-in marker rather than letting them destabilise every pull request.
  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/gateway
    services:
      postgres:
        image: postgres:16
        # Same image and same default credentials as `infra/docker-compose.yml`, so the schema CI
        # tests against is the schema a developer runs against.
        env:
          POSTGRES_USER: tally
          POSTGRES_PASSWORD: tally
          POSTGRES_DB: tally
        ports:
          - 5432:5432
        # Steps must not start before the database answers, or the migration step races the boot.
        options: >-
          --health-cmd "pg_isready -U tally -d tally"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      # The variable the two suites gate on. Setting it is what un-skips them. `TALLY_POSTGRES_DSN`
      # is deliberately NOT set alongside it (CTO-394): no step here runs `gateway.seed`, and
      # `Settings` reads `TALLY_*` straight off the environment, so setting it would hand a live
      # database to every test that builds `Settings()` from the environment, including any that
      # means to assert a no-database path.
      TALLY_TEST_POSTGRES_DSN: postgresql://tally:tally@localhost:5432/tally
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync (dev)
        run: uv sync --extra dev

      # A service container has no `/docker-entrypoint-initdb.d` mounts, so unlike `make up` nothing
      # applies the schema on its own. This replays the directory the same way `make pg-migrate`
      # does: every file, in LC_ALL=C order, with ON_ERROR_STOP so a broken migration fails the job
      # here rather than as a confusing test error later. Every file is idempotent, so the order only
      # has to satisfy dependencies, which numbering already does.
      #
      # The glob is deliberately unenumerated, so a new migration needs no edit here: #403's `0034`
      # is picked up by this loop the moment it lands, in the right position, with no merge conflict
      # against this file.
      - name: Apply control-plane migrations
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql-client
          fi
          for f in $(ls ../../db/postgres/*.sql | LC_ALL=C sort); do
            echo "applying $(basename "$f")"
            psql -v ON_ERROR_STOP=1 -q "$TALLY_TEST_POSTGRES_DSN" -f "$f"
          done

      # Migrations alone are NOT enough, and this step exists because leaving it out fails ten tests.
      # `usage_limits.plan` and `tenants.plan` are foreign keys onto `plan_tiers`, which 0001 creates
      # EMPTY: the rows are reference data that provisioning inserts, not schema. So every tenant
      # `test_adopt_org_pg.py` creates violates `usage_limits_plan_fkey` until a tier exists. This is
      # the same 'free' tier `gateway/seed.py` inserts (kept as a narrow INSERT rather than a full
      # `python -m gateway.seed` so CI does not mint and print an API key it has no use for).
      - name: Seed reference data
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -q "$TALLY_TEST_POSTGRES_DSN" -c \
            "INSERT INTO plan_tiers (name, max_traces_per_month, max_features, price_micro_usd)
             VALUES ('free', 1000000, 10, 0) ON CONFLICT (name) DO NOTHING"

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q -rs

      # THE GUARD, and why it asserts about these tests rather than about the whole run.
      #
      # Without a guard this job silently reverts to the old behaviour the moment the service
      # container, the DSN or the migration step breaks: the gated tests skip, pytest still exits 0,
      # and the check goes green covering nothing. That is precisely how these tests went dark for as
      # long as they did, so the fix is not complete without making the dark state loud.
      #
      # But "nothing anywhere was skipped" is the wrong assertion, because some skips are correct.
      # `tests/test_athena_export.py` and `tests/test_bq_export.py` skip when pyarrow, boto3 or
      # google-cloud-bigquery ARE installed: what they cover is a lazy-import guard that an installed
      # dependency makes unreachable. The `s3` and `secrets` extras already depend on boto3, so a
      # whole-run assertion turns this job red for a correct skip the first time a dependency moves,
      # and the next person weakens the guard to get their pull request green. So the assertion is
      # about the tests this job provisions a database FOR.
      #
      # It reads the JUnit XML rather than grepping the log, so a test id or an `-rs` reason that
      # contains something like "0 skipped" cannot trip it, and it counts what actually ran per file
      # so a deselection or a rename fails with its own message instead of as a side effect of some
      # other check. A module that no longer exists is a pytest usage error, which fails the step
      # before the XML is read.
      - name: Prove the Postgres-gated tests executed
        run: |
          set -euo pipefail
          uv run pytest -v -rs --junitxml="$RUNNER_TEMP/pg-tests.xml" \
            tests/test_batch_idempotency_pg.py tests/test_adopt_org_pg.py \
            tests/test_price_overrides_pg.py \
            tests/test_scheduler_locking.py tests/test_scheduler_pooling.py
          python3 - "$RUNNER_TEMP/pg-tests.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          # Every test that needs the service container, and the FLOOR each must not drop below. The
          # scheduler files hold fakes too, so those two count only their live `test_live_*` tests.
          #
          # A floor, not an exact count: the failure this guard exists to catch is a gated test
          # silently NOT running, which always shows up as the number going DOWN (a skip, a
          # deselection, a rename, a removal). An exact count also failed when a PR legitimately
          # ADDED coverage, which is how CTO-389 turned main red minutes after CTO-394 landed: 11
          # tests ran, all passing, and the guard rejected them. Raise a floor when you add tests
          # you want protected; nothing breaks if you forget.
          #
          # Keyed on the dotted module, because pytest's default `xunit2` JUnit family does not
          # write the `file` attribute that `xunit1` did; `classname` is what survives.
          EXPECTED = {
              "tests.test_batch_idempotency_pg": (11, ""),
              "tests.test_adopt_org_pg": (10, ""),
              # CTO-416: the price override ledger's real SQL. Everything else about that feature is
              # tested against a fake store, so without these the MAX(version)+1 append, the unique
              # index that decides a concurrent append, the append-only trigger and migration 0035
              # itself are exercised by nothing in CI.
              "tests.test_price_overrides_pg": (9, ""),
              "tests.test_scheduler_locking": (4, "test_live_"),
              "tests.test_scheduler_pooling": (1, "test_live_"),
          }

          def path_of(module):
              return module.replace(".", "/") + ".py"

          ran = {module: 0 for module in EXPECTED}
          problems = []
          for case in ET.parse(sys.argv[1]).getroot().iter("testcase"):
              module = case.get("classname") or ""
              expected = EXPECTED.get(module)
              name = case.get("name") or ""
              if expected is None or not name.startswith(expected[1]):
                  continue
              ran[module] += 1
              for outcome in ("skipped", "failure", "error"):
                  found = case.find(outcome)
                  if found is not None:
                      problems.append(
                          f"{path_of(module)}::{name} {outcome}: {found.get('message') or ''}"
                      )

          failed = False
          for module, (count, prefix) in EXPECTED.items():
              if ran[module] < count:
                  failed = True
                  what = f"{prefix}* tests" if prefix else "tests"
                  print(
                      f"::error::{path_of(module)}: {ran[module]} {what} ran, fewer than the floor "
                      f"of {count}. A Postgres-gated test was skipped, deselected, renamed or "
                      "removed (CTO-394)."
                  )
          for problem in problems:
              failed = True
              print(f"::error::{problem} (CTO-394)")
          if failed:
              print(
                  "::error::The Postgres-gated tests did not all execute against the service "
                  "container. Check the service container, TALLY_TEST_POSTGRES_DSN, and the "
                  "migration and seed steps above."
              )
              sys.exit(1)

          total = sum(ran.values())
          floor = sum(count for count, _ in EXPECTED.values())
          print(
              f"{total} Postgres-gated tests executed against the service container "
              f"(floor {floor})."
          )
          PY

  edge-proxy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/edge-proxy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: infra/edge-proxy/go.mod
      - name: Vet
        run: go vet ./...
      - name: Gofmt
        run: test -z "$(gofmt -l .)"
      - name: Test (race + latency budget)
        run: go test -race ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      # #341: examples/ is outside web/tsconfig.json's include, so nothing compiled the example
      # scripts. They run under `tsx`, not a bundler, and examples/tsconfig.json is written to match
      # that; it borrows this job's TypeScript rather than adding a second lockfile for two files.
      - name: Typecheck examples
        run: npx tsc -p ../examples/tsconfig.json
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Build
        # Build via the dev escape hatch (Initiative 1, §10), the same keyless mode `make up` and the
        # vitest suite run in: with TALLY_DEV_TENANT set the app mounts no ClerkProvider and needs no
        # Clerk publishableKey, so the static prerender does not require a Clerk account. CI holds no
        # Clerk keys by design (CTO-259).
        #
        # Keep this value identical to `web/vitest.config.ts`. It is a placeholder UUID, not the
        # name `local-dev`: the canonical TenantId is `tenants.id` and the dashboard binds this
        # straight into the ClickHouse read filter, so a name would pin CI to a filter shape that
        # matches nothing. CI has no ClickHouse, so the value is never read against real data.
        run: npm run build
        env:
          TALLY_DEV_TENANT: "00000000-0000-0000-0000-000000000000"

  # CTO-334: publish container images with a provenance. Until this job existed, every deploy began
  # with "build it on your laptop" and no running container could be traced back to a commit.
  #
  # Registries, and why both. GHCR is the public distribution channel: it is the registry
  # `infra/edge-proxy/deploy/helm/edge-proxy/values.yaml` already pointed at, it needs no AWS account
  # to pull from, and self-hosted installs are its audience. ECR is the deployment registry for our
  # own ECS Fargate services: tasks pull it over a VPC endpoint with no NAT egress, and the execution
  # role in `deploy/aws/ecs/iam/` already grants exactly that pull. Publishing to only one would
  # leave the other half of the tree pointing at an artifact nothing produces, which is the bug this
  # job closes.
  #
  # What is published. The gateway and the edge proxy. The web image is built here but deliberately
  # not pushed; the matrix entry says why.
  #
  # Architecture. Fargate ARM64 is cheaper per vCPU-hour than X86_64 and the edge proxy is
  # deliberately kept warm, so the lever is worth pulling; the three task definitions under
  # `deploy/aws/ecs/` are pinned to ARM64 to match. The job runs on GitHub's native ARM runners
  # rather than emulating, because QEMU would make `next build` and the pip install unreasonably
  # slow. The edge proxy is additionally published for amd64, because its Helm chart targets customer
  # clusters that are mostly x86 and a stdlib-only Go binary cross-compiles for free.
  images:
    # Named off the matrix entry, or GitHub builds the check name out of every matrix value and the
    # required-check list becomes unreadable.
    name: image (${{ matrix.name }})
    needs: [python-sdk, gateway, edge-proxy, web]
    # Free for public repositories, and native for the arm64 images we ship (see above).
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
      # Required for the OIDC token exchanged for the ECR push role. No long-lived AWS access key
      # exists in this repository and none should be added.
      id-token: write
    strategy:
      # One image failing should not hide the state of the other two.
      fail-fast: false
      matrix:
        include:
          # The gateway Dockerfile COPYs both the gateway and the SDK it depends on, so its build
          # context is the repo root (the same as `infra/docker-compose.yml` uses).
          - name: gateway
            context: .
            dockerfile: infra/gateway/Dockerfile
            platforms: linux/arm64
            ghcr: ai-tally-gateway
            ecr: ai-tally/gateway
            publish: "true"
            build_args: ""
          - name: edge-proxy
            context: infra/edge-proxy
            dockerfile: infra/edge-proxy/Dockerfile
            platforms: linux/amd64,linux/arm64
            ghcr: ai-tally-edge-proxy
            ecr: ai-tally/edge-proxy
            publish: "true"
            build_args: ""
          # Built on every publish run, never pushed. A web image cannot be a tenant-neutral registry
          # artifact: Clerk's NEXT_PUBLIC_ publishable key is inlined into the client bundle at build
          # time, so an image built without one can never sign anybody in and an image built with one
          # belongs to a single deployment. The dashboard's production home is Vercel anyway
          # (docs/self-hosted-scope.md), and docs/aws-bundle-scope.md keeps web.taskdef.json only as
          # an escape hatch the bundle does not use, so the operator builds that one themselves with
          # their own keys (deploy/aws/README.md section 1). Building it here still earns its place:
          # the first run of this job caught web/Dockerfile silently dropping .npmrc, which had made
          # the image unbuildable, and nothing else in CI would have noticed.
          - name: web
            context: web
            dockerfile: web/Dockerfile
            platforms: linux/arm64
            ghcr: ai-tally-web
            ecr: ai-tally/web
            publish: "false"
            # Same placeholder UUID the `web` job above builds with, and for the same reason: the
            # static prerender of /_not-found would otherwise need a Clerk publishable key.
            build_args: |
              TALLY_DEV_TENANT=00000000-0000-0000-0000-000000000000
    steps:
      - uses: actions/checkout@v4
        with:
          # The pull-request gate below diffs against the base commit, which a shallow clone lacks.
          fetch-depth: 0

      # When this runs, and why not always. Building three images for every push on every PR branch
      # spends runner minutes on changes that cannot affect an image. So: always on a merge to main
      # and on a release tag, which are the artifacts anyone deploys; on demand via
      # workflow_dispatch; and on a pull request ONLY when that PR touches a Dockerfile, a
      # .dockerignore or this workflow. That last case builds without pushing, so a Dockerfile change
      # is proven buildable in review rather than after it lands on main.
      - name: Decide whether to build and whether to push
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          IMAGE: ${{ matrix.name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "push=true"  >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "push=false" >> "$GITHUB_OUTPUT"
          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          if printf '%s\n' "$changed" | grep -Eq '(^|/)(Dockerfile|\.dockerignore)$|^\.github/workflows/ci\.yml$'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Build inputs changed; building $IMAGE without pushing."
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "No Dockerfile or workflow change in this PR; skipping the $IMAGE image."
          fi

      # Tags, and why these. The commit SHA is the point: it is the one tag that cannot be moved, and
      # it is what a task definition should pin, so every image gets it. `main` is additionally
      # published on a merge so a chart or a compose file has a working default to pull; it moves, so
      # production pins a SHA or a release instead. A `vX.Y.Z` git tag additionally publishes
      # `X.Y.Z`, which is what the Helm chart's appVersion and the task definitions' readable pin
      # refer to. No `latest`: that is the tag that makes a running container untraceable, which is
      # the whole complaint here.
      - name: Compute image tags
        id: tags
        if: steps.gate.outputs.build == 'true'
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          SHA: ${{ github.sha }}
          GHCR_REPO: ghcr.io/${{ github.repository_owner }}/${{ matrix.ghcr }}
          ECR_REGISTRY: ${{ vars.AWS_ECR_REGISTRY }}
          ECR_REPO: ${{ matrix.ecr }}
        run: |
          set -euo pipefail
          suffixes="$SHA"
          if [ "$REF_TYPE" = "tag" ] && [ "${REF_NAME#v}" != "$REF_NAME" ]; then
            suffixes="$suffixes ${REF_NAME#v}"
          elif [ "$REF_NAME" = "main" ]; then
            suffixes="$suffixes main"
          fi
          out="$RUNNER_TEMP/image-tags"
          : > "$out"
          for s in $suffixes; do
            printf '%s:%s\n' "$GHCR_REPO" "$s" >> "$out"
            if [ -n "$ECR_REGISTRY" ]; then
              printf '%s/%s:%s\n' "$ECR_REGISTRY" "$ECR_REPO" "$s" >> "$out"
            fi
          done
          {
            echo "tags<<TAGS_EOF"
            cat "$out"
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"
          cat "$out"

      - name: Set up buildx
        if: steps.gate.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.gate.outputs.build == 'true' && steps.gate.outputs.push == 'true' && matrix.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # The workflow's own short-lived token, not a stored credential.
          password: ${{ secrets.GITHUB_TOKEN }}

      # OIDC only. `AWS_ECR_ROLE_ARN`, `AWS_ECR_REGISTRY` and `AWS_REGION` are repository *variables*,
      # not secrets: a role ARN and a registry hostname are not credentials, and keeping them visible
      # makes it auditable which role CI can assume. While they are unset the ECR half is skipped and
      # the GHCR half still publishes, which is the state of the world until an operator creates the
      # role (there is no IaC in this repository yet, CTO-335). See
      # `deploy/aws/ecs/iam/github-actions-oidc-trust-policy.json` and its sibling policy for exactly
      # what to create. There is deliberately no access-key fallback.
      - name: Configure AWS credentials (OIDC)
        if: steps.gate.outputs.build == 'true' && steps.gate.outputs.push == 'true' && matrix.publish == 'true' && vars.AWS_ECR_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: ai-tally-ci-${{ github.run_id }}

      - name: Log in to ECR
        if: steps.gate.outputs.build == 'true' && steps.gate.outputs.push == 'true' && matrix.publish == 'true' && vars.AWS_ECR_ROLE_ARN != ''
        uses: aws-actions/amazon-ecr-login@v2

      - name: Report that ECR is not configured
        if: steps.gate.outputs.build == 'true' && steps.gate.outputs.push == 'true' && matrix.publish == 'true' && vars.AWS_ECR_ROLE_ARN == ''
        env:
          IMAGE: ${{ matrix.name }}
        run: |
          echo "::notice::AWS_ECR_ROLE_ARN is unset, so $IMAGE is published to GHCR only."
          echo "::notice::Create the OIDC role in deploy/aws/README.md section 1 to enable the ECR push."

      - name: Build and push
        if: steps.gate.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: ${{ steps.gate.outputs.push == 'true' && matrix.publish == 'true' }}
          tags: ${{ steps.tags.outputs.tags }}
          build-args: ${{ matrix.build_args }}
          # Provenance attestations wrap even a single-platform push in an index, which older pullers
          # handle badly. The immutable SHA tag is the provenance that matters here.
          provenance: false
          cache-from: type=gha,scope=${{ matrix.name }}
          # ignore-error so a cache-service hiccup degrades the build to slow rather than red. The
          # image is the deliverable; the cache is an optimisation.
          cache-to: type=gha,mode=max,scope=${{ matrix.name }},ignore-error=true
