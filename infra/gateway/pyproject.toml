[project]
name = "tally-gateway"
version = "0.1.0"
description = "ai-tally ingest gateway — accepts SDK batches, enriches cost, writes to ClickHouse."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "clickhouse-connect>=0.7.16",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "tally-sdk",
]

[project.optional-dependencies]
# GCS replay blob-store backend (CTO-152). Optional so the base install stays slim; imported
# lazily inside GCSReplayBlobStore so the gateway boots without it when the backend is `memory`.
gcs = [
    "google-cloud-storage>=2.10",
]
# S3 / MinIO replay blob-store backend (CTO-158). Optional so the base install stays slim;
# imported lazily inside S3ReplayBlobStore so the gateway boots without it when the backend is
# not `s3`.
s3 = [
    "boto3>=1.34",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "httpx>=0.27",
]
# Optional analytics-mirror sink (CTO-154). Only needed by deployments that turn on the
# per-tenant BigQuery export; `gateway.bq_export` lazy-imports it, so the gateway imports
# and boots fine without this extra installed.
bigquery = [
    "google-cloud-bigquery>=3.20",
]

[tool.uv.sources]
# The gateway reuses the SDK's wire/enrichment/timekeeping/pricing logic directly.
# Distribution name is `tally-sdk`; the import package is `tally`.
tally-sdk = { path = "../../sdk/python", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
